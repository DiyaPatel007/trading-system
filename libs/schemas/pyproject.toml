[project]
name = "trading-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas for the Adaptive AI Trading System"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.6,<3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_schemas*"]
